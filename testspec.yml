version: 0.1

android_test_host: amazon_linux_2

phases:
  install:
    commands:
      - devicefarm-cli use node 22
      - node --version
      - devicefarm-cli use appium 3
      - appium --version
      # `appium` NÃO é devDependency do projeto (regra herdada da referência MobileWDIO,
      # run-22): se fosse, o Appium do host trataria o pacote de teste como APPIUM_HOME e
      # perderia os drivers pré-instalados. Com o APPIUM_HOME do host, o Appium 3 já vem
      # com o UiAutomator2 v6; trocamos pela versão que o Android roda desde sempre
      # (7.6.2 = package-lock.json) no padrão da doc da AWS: uninstall + install@versão.
      - |-
        appium driver uninstall uiautomator2;
        appium driver install uiautomator2@7.6.2;
      - appium driver list --installed
      - export APPIUM_BASE_PATH=
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      # O host às vezes derruba a conexão baixando pacotes (ECONNRESET). Sem
      # dependências o `npm run wdio` dá "wdio: command not found", o teste nem
      # roda e o device some do relatório sem erro óbvio. Três tentativas.
      - |-
        for i in 1 2 3; do
          npm install --prefer-offline && break
          echo "npm install falhou (tentativa $i/3)"; sleep 10
          [ "$i" = 3 ] && { echo "npm install esgotou as 3 tentativas"; exit 1; }
        done

  pre_test:
    commands:
      - |-
        appium --base-path=$APPIUM_BASE_PATH --log-timestamp \
          --log-no-colors --relaxed-security --default-capabilities \
          "{\"appium:deviceName\": \"$DEVICEFARM_DEVICE_NAME\", \
          \"platformName\": \"$DEVICEFARM_DEVICE_PLATFORM_NAME\", \
          \"appium:app\": \"$DEVICEFARM_APP_PATH\", \
          \"appium:udid\":\"$DEVICEFARM_DEVICE_UDID\", \
          \"appium:platformVersion\": \"$DEVICEFARM_DEVICE_OS_VERSION\", \
          \"appium:automationName\": \"UiAutomator2\"}" \
          >> $DEVICEFARM_LOG_DIR/appium.log 2>&1 &

      - |-
        appium_initialization_time=0;
        until curl --silent --fail "http://0.0.0.0:4723${APPIUM_BASE_PATH}/status"; do
          if [[ $appium_initialization_time -gt 30 ]]; then
            echo "Appium did not start within 30 seconds. Exiting...";
            exit 1;
          fi;
          appium_initialization_time=$((appium_initialization_time + 1));
          echo "Waiting for Appium to start on port 4723...";
          sleep 1;
        done;

  test:
    commands:
      - ls $DEVICEFARM_TEST_PACKAGE_PATH
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      # Materializa as credenciais injetadas pelo schedule-run (--configuration
      # environmentVariables) num .env local — o pacote nunca carrega segredos.
      # TEST_USER_EMAILS / TEST_USER_DEVICE_MODELS só existem quando o CI está em
      # modo "uma conta por device" (secret TEST_USER_ANDROID_EMAILS); vazias, o
      # runtime cai em TEST_USER_EMAIL (test/utils/credentials.ts).
      # Guarda: credencial ausente falha AQUI, com nome, e não três telas depois
      # dentro do login. Os valores nunca vão para o log — só os comprimentos.
      - |-
        if [ -z "${TEST_USER_EMAIL:-}${TEST_USER_EMAILS:-}" ] || [ -z "${TEST_USER_PASSWORD:-}" ] || [ -z "${TEST_USER_PIN:-}" ]; then
          echo "Credenciais ausentes no host: confira as environmentVariables do step 'Agenda o run (Android)' em mobile_test.yml"
          exit 1
        fi
      - 'echo "[diag] TEST_USER_EMAIL len=${#TEST_USER_EMAIL} TEST_USER_EMAILS len=${#TEST_USER_EMAILS} TEST_USER_DEVICE_MODELS len=${#TEST_USER_DEVICE_MODELS} TEST_USER_PASSWORD len=${#TEST_USER_PASSWORD} TEST_USER_PIN len=${#TEST_USER_PIN}"'
      - 'printf "TEST_USER_EMAIL=%s\nTEST_USER_EMAILS=%s\nTEST_USER_DEVICE_MODELS=%s\nTEST_USER_PASSWORD=%s\nTEST_USER_PASSWORD_IOS=%s\nBUILD_PROFILE_ANDROID=%s\nTEST_USER_PIN=%s\n" "${TEST_USER_EMAIL:-}" "${TEST_USER_EMAILS:-}" "${TEST_USER_DEVICE_MODELS:-}" "$TEST_USER_PASSWORD" "${TEST_USER_PASSWORD_IOS:-}" "${BUILD_PROFILE_ANDROID:-}" "$TEST_USER_PIN" > .env'
      # Versão/build/profile do app (do EAS, via environmentVariables) → environment.properties do Allure.
      - 'printf "APP_VERSION=%s\nAPP_BUILD_VERSION=%s\nAPP_BUILD_PROFILE=%s\n" "${APP_VERSION:-}" "${APP_BUILD_VERSION:-}" "${APP_BUILD_PROFILE:-}" >> .env'
      - 'echo "[diag] app ${APP_VERSION:-?} (${APP_BUILD_VERSION:-?}) profile ${APP_BUILD_PROFILE:-?}"'
      - npm run wdio

  post_test:
    commands:
      - echo "Testes finalizados"

artifacts:
  - $DEVICEFARM_LOG_DIR
