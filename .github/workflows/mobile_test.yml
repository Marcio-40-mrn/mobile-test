name: Mobile E2E — AWS Device Farm

# Roda os testes E2E no AWS Device Farm — TUDO num arquivo só (job device-farm com matrix).
# - Android: roda em todo pull_request e no dispatch manual.
# - iOS: GATED — só roda via dispatch manual com run_ios=true. A suíte já é
#   cross-platform (capabilities XCUITest no wdio.conf.ts + camada de seletores em
#   test/support/locator.ts), mas os seletores iOS foram derivados das regras de
#   tradução e ainda não foram validados contra um device real. Por isso não roda
#   em PRs. Para inspecionar a árvore de elementos, use `npm run dump:ios`
#   localmente contra uma sessão aberta no Device Farm.
# O job `setup` monta a matrix dinamicamente para aplicar esse gate.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_ios:
        description: "Rodar também o job iOS (experimental — ainda não pronto)"
        type: boolean
        default: false

# Cancela runs antigos da mesma ref quando um novo começa.
concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide quais plataformas rodam nesta execução (gate do iOS).
  setup:
    name: Resolve plataformas
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.m.outputs.platforms }}
    steps:
      - id: m
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_ios }}" = "true" ]; then
            echo 'platforms=["android","ios"]' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=["android"]' >> "$GITHUB_OUTPUT"
          fi

  device-farm:
    name: "${{ matrix.platform }} — Device Farm"
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      # Uma plataforma não cancela a outra ao falhar.
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.setup.outputs.platforms) }}
    env:
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instala EAS CLI e Allure
        run: npm install -g eas-cli allure-commandline

      - name: Resolve parâmetros da plataforma
        id: vars
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "android" ]; then
            echo "app_file=app.apk"          >> "$GITHUB_OUTPUT"
            echo "app_type=ANDROID_APP"       >> "$GITHUB_OUTPUT"
            echo "testspec=testspec.yml"      >> "$GITHUB_OUTPUT"
          else
            echo "app_file=app.ipa"           >> "$GITHUB_OUTPUT"
            echo "app_type=IOS_APP"           >> "$GITHUB_OUTPUT"
            echo "testspec=testspec-ios.yml"  >> "$GITHUB_OUTPUT"
          fi

      - name: Baixa o build mais recente do EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "ios" ]; then
            # As builds iOS do projeto saem do perfil `production`, cuja distribution
            # é `store` — filtrar por `internal` (como no Android) as excluía e o job
            # não achava build nenhuma. Aqui só descartamos builds de SIMULADOR, que
            # geram .app/.tar.gz e não instalam em device real; store e internal
            # servem, porque o Device Farm re-assina o .ipa.
            echo "Buscando build iOS finalizada (qualquer distribution exceto simulator)..."
            BUILD_JSON=$(eas build:list --platform ios --limit 10 \
              --status finished --json --non-interactive)
            echo "$BUILD_JSON" | jq -r '.[] | "  - \(.id) distribution=\(.distribution // "?") artifacts=\(if .artifacts.buildUrl then "sim" else "não" end)"'
            URL=$(echo "$BUILD_JSON" | jq -r '
              [ .[] | select((.distribution // "" | ascii_downcase) != "simulator")
                    | select(.artifacts.buildUrl) ][0].artifacts.buildUrl // empty')
          else
            echo "Buscando build Android INTERNAL finalizada..."
            BUILD_JSON=$(eas build:list --platform android --limit 1 \
              --status finished --distribution internal --json --non-interactive)
            URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl // empty')
          fi
          if [ -z "$URL" ]; then
            if [ "${{ matrix.platform }}" = "ios" ]; then
              echo "::error::Nenhuma build iOS instalável encontrada no EAS (a listagem acima mostra o que existe). É preciso uma build finalizada, com artifact, que não seja de simulador."
            else
              echo "::error::Nenhuma build Android INTERNAL finalizada encontrada no EAS."
            fi
            exit 1
          fi
          curl -sSL --retry 3 -o "${{ steps.vars.outputs.app_file }}" "$URL"
          ls -lh "${{ steps.vars.outputs.app_file }}"

      - name: Empacota os testes (sem node_modules — o Device Farm roda npm install)
        run: |
          set -euo pipefail
          zip -r test-package.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x ".claude/*" \
            -x "docs/*" \
            -x "reports/*" \
            -x "test/screenshots/*" \
            -x "artifacts/*" \
            -x "app.apk" -x "app.ipa" \
            -x "test-package.zip"
          ls -lh test-package.zip

      - name: Configura credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Sobe artefatos e agenda o run no Device Farm
        id: schedule
        env:
          PROJECT_ARN: ${{ secrets.DEVICE_FARM_PROJECT_ARN }}
          RUN_NUMBER: ${{ github.run_number }}
          APP_FILE: ${{ steps.vars.outputs.app_file }}
          APP_TYPE: ${{ steps.vars.outputs.app_type }}
          TESTSPEC: ${{ steps.vars.outputs.testspec }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER_PIN: ${{ secrets.TEST_USER_PIN }}
        run: |
          set -euo pipefail

          # Escolhe o device pool conforme a plataforma (secret fica no step, mascarado).
          if [ "${{ matrix.platform }}" = "android" ]; then
            POOL_ARN="${{ secrets.DEVICE_FARM_DEVICE_POOL_ARN }}"
          else
            POOL_ARN="${{ secrets.DEVICE_FARM_IOS_DEVICE_POOL_ARN }}"
          fi

          # create → transfer (curl PUT no S3 pré-assinado) → wait até SUCCEEDED.
          # IMPORTANTE: todo log da função vai para stderr (>&2). Só o arn final sai no
          # stdout — senão o $(upload ...) captura as linhas de progresso junto e o
          # schedule-run recebe um "arn" inválido (ValidationException: Invalid arn ...).
          upload() {
            local name="$1" type="$2" file="$3"
            local resp arn url status i
            resp=$(aws devicefarm create-upload --project-arn "$PROJECT_ARN" \
              --name "$name" --type "$type" --query 'upload.{arn:arn,url:url}' --output json)
            arn=$(echo "$resp" | jq -r .arn)
            url=$(echo "$resp" | jq -r .url)
            curl -sS -T "$file" "$url"
            for i in $(seq 1 20); do
              status=$(aws devicefarm get-upload --arn "$arn" --query 'upload.status' --output text)
              echo "$name: $status ($i/20)" >&2
              [ "$status" = "SUCCEEDED" ] && { echo "$arn"; return 0; }
              [ "$status" = "FAILED" ] && { echo "::error::Upload $name falhou" >&2; return 1; }
              sleep 10
            done
            echo "::error::Timeout no upload $name" >&2; return 1
          }

          APP_ARN=$(upload "app-${RUN_NUMBER}.${APP_FILE##*.}" "$APP_TYPE" "$APP_FILE")
          TEST_ARN=$(upload "tests-${RUN_NUMBER}.zip" APPIUM_NODE_TEST_PACKAGE test-package.zip)
          SPEC_ARN=$(upload "spec-${RUN_NUMBER}.yml" APPIUM_NODE_TEST_SPEC "$TESTSPEC")

          # Injeta as credenciais como environmentVariables — o testspec as materializa em .env.
          # Só variáveis com valor entram aqui: a API do Device Farm valida
          # `min length: 1` e rejeita o schedule-run inteiro se algum value vier vazio.
          ENV_JSON=$(jq -nc \
            --arg email "$TEST_USER_EMAIL" \
            --arg pass  "$TEST_USER_PASSWORD" \
            --arg pin   "$TEST_USER_PIN" \
            '{environmentVariables:[
              {name:"TEST_USER_EMAIL",value:$email},
              {name:"TEST_USER_PASSWORD",value:$pass},
              {name:"TEST_USER_PIN",value:$pin}
            ]}')

          TEST_JSON=$(jq -nc \
            --arg tp "$TEST_ARN" --arg ts "$SPEC_ARN" \
            '{type:"APPIUM_NODE",testPackageArn:$tp,testSpecArn:$ts}')

          RUN_ARN=$(aws devicefarm schedule-run \
            --project-arn "$PROJECT_ARN" \
            --app-arn "$APP_ARN" \
            --device-pool-arn "$POOL_ARN" \
            --name "CI ${{ matrix.platform }} #${RUN_NUMBER}" \
            --test "$TEST_JSON" \
            --configuration "$ENV_JSON" \
            --query 'run.arn' --output text)
          echo "run_arn=$RUN_ARN" >> "$GITHUB_OUTPUT"
          echo "Run agendado: $RUN_ARN"

      - name: Aguarda o run terminar
        env:
          RUN_ARN: ${{ steps.schedule.outputs.run_arn }}
        run: |
          set -euo pipefail
          REACHED_TERMINAL=false
          STATUS=""; RESULT_VAL=""
          for i in $(seq 1 120); do
            READ=$(aws devicefarm get-run --arn "$RUN_ARN" --query 'run.[status,result]' --output text)
            STATUS=$(echo "$READ" | awk '{print $1}')
            RESULT_VAL=$(echo "$READ" | awk '{print $2}')
            echo "Status ($i/120): $STATUS / $RESULT_VAL"
            case "$STATUS" in
              PENDING|PENDING_CONCURRENCY|PENDING_DEVICE|PREPARING|RUNNING|SCHEDULING) sleep 60 ;;
              *) REACHED_TERMINAL=true; break ;;
            esac
          done
          if [ "$REACHED_TERMINAL" != "true" ]; then
            echo "::error::Timeout aguardando o Device Farm (último status: $STATUS)."
            exit 1
          fi
          echo "::notice::Device Farm ${{ matrix.platform }}: $RESULT_VAL — ver relatório Allure"
          echo "**Device Farm (${{ matrix.platform }}):** \`$RESULT_VAL\` — o resultado reflete no relatório, não quebra a esteira." >> "$GITHUB_STEP_SUMMARY"

      - name: Coleta artefatos (Allure) do Device Farm
        if: always()
        env:
          RUN_ARN: ${{ steps.schedule.outputs.run_arn }}
        run: |
          set -uo pipefail
          mkdir -p artifacts allure-results
          [ -z "${RUN_ARN:-}" ] && { echo "Sem run_arn — pulando coleta"; exit 0; }
          i=0
          for JOB_ARN in $(aws devicefarm list-jobs --arn "$RUN_ARN" --query 'jobs[].arn' --output text); do
            SUITE_ARN=$(aws devicefarm list-suites --arn "$JOB_ARN" \
              --query "suites[?name=='Tests Suite'].arn | [0]" --output text)
            [ -z "$SUITE_ARN" ] || [ "$SUITE_ARN" = "None" ] && { i=$((i+1)); continue; }
            TEST_ARN=$(aws devicefarm list-tests --arn "$SUITE_ARN" --query 'tests[0].arn' --output text)
            URL=$(aws devicefarm list-artifacts --arn "$TEST_ARN" --type FILE \
              --query "artifacts[?name=='Customer Artifacts'].url | [0]" --output text)
            if [ -n "$URL" ] && [ "$URL" != "None" ]; then
              curl -sL --retry 3 --max-time 180 "$URL" -o "artifacts/ca-$i.zip" || true
              unzip -o "artifacts/ca-$i.zip" -d "artifacts/ca-$i" >/dev/null 2>&1 || true
              # Os allure-results ficam em algum nível dentro do $DEVICEFARM_LOG_DIR extraído.
              find "artifacts/ca-$i" -type d -name allure-results -exec cp -r {}/. allure-results/ \; 2>/dev/null || true
            fi
            i=$((i+1))
          done
          echo "allure-results coletados: $(ls -1 allure-results | wc -l) arquivos"

      - name: Publica allure-results como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # O número da run no nome é o que permite apagar este artifact junto com a
          # pasta run-N podada da branch reports (step "Apaga artifacts das runs podadas").
          name: allure-results-${{ matrix.platform }}-${{ github.run_number }}
          path: allure-results
          if-no-files-found: warn
          retention-days: 30

  publish-report:
    name: Publica relatório Allure no GitHub Pages
    needs: device-farm
    if: always()
    runs-on: ubuntu-latest
    # Teto duro do job: vale para qualquer step. Sem isto, um ffmpeg travado no handler
    # interativo segurou o runner por 4h05.
    timeout-minutes: 30
    permissions:
      contents: write   # push na branch reports
      actions: write    # DELETE em /actions/artifacts/<id>
    env:
      # ÚNICA variável de retenção: quantas pastas run-*/ ficam na branch reports.
      KEEP: "3"
    # Serializa publicações de runs sobrepostas para evitar corrida de push na branch reports.
    concurrency:
      group: reports-publish
      cancel-in-progress: false

    steps:
      - name: Define RUN_DIR (fonte única da verdade)
        # Calculado UMA vez. Antes era recomputado no publish e no print da URL: se o job
        # cruzasse a meia-noite UTC entre os dois, a URL apontava para uma pasta inexistente.
        run: echo "RUN_DIR=run-${{ github.run_number }}-$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Checkout main (para ter os scripts)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instala Allure CLI
        run: npm install -g allure-commandline

      - name: Baixa allure-results Android
        uses: actions/download-artifact@v4
        with:
          name: allure-results-android-${{ github.run_number }}
          path: allure-results-android/
        continue-on-error: true

      - name: Baixa allure-results iOS
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ios-${{ github.run_number }}
          path: allure-results-ios/
        continue-on-error: true

      - name: Valida allure-results (exige ao menos um *-result.json)
        run: |
          # Diretório não-vazio NÃO serve como critério: environment.properties, categories.json,
          # executor.json e history/ são arquivos fixos do Allure e produzem um relatório de
          # 0 testes visualmente idêntico a um sucesso. O único sinal de execução real é
          # a presença de *-result.json.
          for PLAT in android ios; do
            SRC="allure-results-$PLAT"
            # Diretório ausente = plataforma não rodou nesta run (o iOS é opcional, via input
            # run_ios). Isso é esperado e não merece anotação — só o caso abaixo merece.
            if [ ! -d "$SRC" ]; then
              echo "$PLAT: não executado nesta run"
              continue
            fi
            if [ -n "$(find "$SRC" -maxdepth 1 -type f -name '*-result.json' -print -quit)" ]; then
              echo "$PLAT: $(find "$SRC" -maxdepth 1 -type f -name '*-result.json' | wc -l) resultado(s) de teste"
            else
              # A plataforma rodou mas não trouxe nenhum resultado — isso É um problema.
              echo "::warning::$SRC existe mas não tem nenhum *-result.json — plataforma $PLAT ignorada nesta run."
              # Remove o diretório: a partir daqui `[ -d "$SRC" ]` volta a ser critério
              # correto em TODOS os steps seguintes (histórico, ffmpeg, generate).
              rm -rf "$SRC"
            fi
          done

      - name: Checkout da branch reports
        uses: actions/checkout@v4
        with:
          ref: reports
          path: reports-branch
          # fetch-depth: 1 — só a árvore do commit mais recente (já contém todos os run-N/).
          # Evita baixar todo o histórico pesado da branch (relatórios + vídeos), que corrompia
          # o checkout e causava "fatal: could not parse HEAD" no commit.
          fetch-depth: 1

      - name: Copia o histórico Allure por plataforma (aba Trend)
        run: |
          # Cada plataforma acumula só o seu histórico: lê do último run que tenha
          # a subpasta da plataforma. Roda ANTES de gerar o relatório atual.
          LATEST=$(ls reports-branch/ | grep "^run-" | sort -V | tail -1)
          for PLAT in android ios; do
            # GUARDA: só semeia histórico de plataforma que realmente rodou. Sem isto o
            # `mkdir -p` abaixo RECRIA o diretório que o step de validação apagou, e o Allure
            # gera um relatório de 0 testes com aba Trend — pior que nenhum relatório.
            if [ ! -d "allure-results-$PLAT" ]; then
              echo "Sem resultados $PLAT — histórico não semeado"
              continue
            fi
            SRC="reports-branch/$LATEST/$PLAT/history"
            if [ -n "$LATEST" ] && [ -d "$SRC" ]; then
              mkdir -p "allure-results-$PLAT/history"
              cp -r "$SRC/." "allure-results-$PLAT/history/"
              echo "Histórico $PLAT copiado de: $LATEST"
            else
              echo "Nenhum histórico $PLAT anterior encontrado"
            fi
          done

      - name: Re-encoda vídeos para H.264 (player do navegador)
        if: always()
        continue-on-error: true
        # Teto do step: mesmo com -nostdin e timeout por arquivo, um lote grande não pode
        # comer o orçamento inteiro do job.
        timeout-minutes: 20
        # Explícito porque o bloco abaixo usa process substitution (3< <(...)), que é bash,
        # não POSIX sh — imune a uma futura mudança de defaults.run.shell neste arquivo.
        shell: bash
        run: |
          # Normaliza TODOS os .mp4 para H.264 + faststart com bitrate limitado e downscale,
          # mantendo o mesmo nome (a referência no *-result.json continua válida). Motivos:
          #  - Android (MediaProjection): já é h264, MAS em resolução alta passava de 100MB
          #    (limite por arquivo do GitHub) e era apagado no publish -> vídeo 404 no
          #    relatório. Re-encodar com -maxrate 2M + downscale garante <95MB.
          #  - iOS (Appium 1.x, quando habilitado): grava em MJPEG, que o navegador não toca
          #    em <video> — precisa virar h264.
          which ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y ffmpeg; }
          for PLAT in android ios; do
            SRC="allure-results-$PLAT"
            [ -d "$SRC" ] || continue
            # ARMADILHA (custou uma run de 4h05): sem -nostdin o ffmpeg herda a stdin do
            # `while read` e ENGOLE a lista de arquivos do find; ao receber lixo binário cai no
            # handler interativo ("Enter command: <target>|all <time>|-1 <command>[ <argument>]")
            # e fica bloqueado para sempre. Três correções combinadas:
            #   1) -nostdin             -> o ffmpeg não abre stdin;
            #   2) lista no FD 3        -> mesmo que abrisse, não é a stdin do laço;
            #   3) timeout 300 por arq. -> teto duro por arquivo, para qualquer travamento novo.
            while IFS= read -r -u 3 f; do
              # `|| true`: o run: roda com `bash -e`, e o ffprobe falha em .mp4 truncado —
              # sem isso a atribuição derrubaria o step inteiro.
              codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$f" 2>/dev/null || true)
              if timeout 300 ffmpeg -nostdin -y -loglevel error -i "$f" \
                   -vf "scale=-2:'min(1280,ih)'" \
                   -c:v libx264 -crf 28 -preset veryfast -maxrate 2M -bufsize 4M \
                   -pix_fmt yuv420p -an -movflags +faststart "${f}.tmp.mp4"; then
                mv "${f}.tmp.mp4" "$f"
                echo "Re-encodado $f ($codec -> h264, <=720p/2Mbps)"
              else
                rm -f "${f}.tmp.mp4"
                echo "::warning::Falha/timeout ao re-encodar $f (codec $codec) — mantido original"
              fi
            done 3< <(find "$SRC" -type f -name '*.mp4')
          done

      - name: Gera os relatórios Allure HTML por plataforma
        run: |
          for PLAT in android ios; do
            SRC="allure-results-$PLAT"
            # O step "Valida allure-results" já removeu diretórios sem *-result.json,
            # então a existência do diretório é critério suficiente e correto aqui.
            if [ -d "$SRC" ]; then
              allure generate "./$SRC" --clean -o "./allure-report-$PLAT"
              echo "Relatório $PLAT gerado"
            else
              echo "Sem resultados $PLAT — pulando geração"
            fi
          done

      - name: Gera relatórios single-file (baixável)
        if: always()
        run: |
          for PLAT in android ios; do
            SRC="allure-results-$PLAT"
            if [ -d "$SRC" ]; then
              allure generate "./$SRC" --clean --single-file -o "./allure-single-$PLAT"
              echo "Single-file $PLAT em ./allure-single-$PLAT/index.html"
            else
              echo "Sem resultados $PLAT — pulando single-file"
            fi
          done

      - name: Publica relatório Android (single-file) como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-android-${{ github.run_number }}
          path: allure-single-android/
          if-no-files-found: warn
          retention-days: 30

      - name: Publica relatório iOS (single-file) como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-ios-${{ github.run_number }}
          path: allure-single-ios/
          if-no-files-found: warn
          retention-days: 30

      - name: Publica os relatórios na branch reports
        if: always()
        timeout-minutes: 15
        run: |
          set -u

          # Números das runs podadas, consumidos pelo step seguinte. Ficam em $RUNNER_TEMP,
          # FORA de reports-branch/: qualquer arquivo dentro do checkout entraria no
          # `git add -A` e seria commitado junto com o relatório.
          PRUNED_LIST="$RUNNER_TEMP/pruned-runs.txt"
          : > "$PRUNED_LIST"

          # --- Guarda: nada gerado -> não publica, mas explica claramente o motivo ---
          if [ ! -d "allure-report-android" ] && [ ! -d "allure-report-ios" ]; then
            MSG="Nenhuma plataforma produziu *-result.json — relatório não publicado nesta run."
            echo "::warning::$MSG"
            echo "**Publicação:** $MSG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cd reports-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Estado do remoto conhecido neste momento (o checkout veio dele).
          REMOTE_SHA="$(git rev-parse HEAD)"
          BASE_TREE="$(git rev-parse HEAD^{tree})"

          # (Re)aplica a contribuição desta run sobre a árvore ATUAL da branch reports.
          # É idempotente: pode rodar de novo após re-sincronizar com o remoto.
          apply_changes() {
            for PLAT in android ios; do
              if [ -d "../allure-report-$PLAT" ]; then
                rm -rf "$RUN_DIR/$PLAT"
                mkdir -p "$RUN_DIR/$PLAT"
                cp -r "../allure-report-$PLAT/." "$RUN_DIR/$PLAT/"
                echo "Copiado $PLAT para: $RUN_DIR/$PLAT"
              else
                echo "Sem relatório $PLAT para copiar"
              fi
            done

            # A mesma run republicada em outra data (re-run) não pode virar duas pastas.
            for d in run-${{ github.run_number }}-*; do
              [ -d "$d" ] || continue
              [ "$d" = "$RUN_DIR" ] || { rm -rf "./$d"; echo "Removida duplicata da mesma run: $d"; }
            done

            # --- RETENÇÃO: mantém apenas os $KEEP runs mais recentes ---
            # `sort -V` é OBRIGATÓRIO: em ordem lexicográfica run-100 viria ANTES de run-9,
            # e a poda apagaria justamente os runs mais novos.
            : > "$PRUNED_LIST"
            find . -maxdepth 1 -type d -name 'run-*' -printf '%P\n' \
              | sort -V | head -n "-$KEEP" | while IFS= read -r d; do
                  [ -n "$d" ] || continue
                  rm -rf "./$d"
                  printf '%s\n' "$d" | sed -E 's/^run-([0-9]+)-.*/\1/' >> "$PRUNED_LIST"
                  echo "Podado (retenção KEEP=$KEEP): $d"
                done

            # Roda DEPOIS da poda: o script varre o disco, então os runs removidos
            # somem da tabela sem depender do JavaScript do cliente.
            node ../scripts/generate-report-index.mjs .

            # Remove anexos > 95MB (limite de 100MB por arquivo do GitHub).
            # Exclui .git/ — caso contrário o packfile (>95MB com vídeos acumulados)
            # é apagado e o git seguinte falha com "fatal: could not parse HEAD".
            # O commit órfão NÃO dispensa isto: o limite é por blob da árvore nova.
            find . -path './.git' -prune -o -type f -size +95M -print0 | xargs -0 -r rm -f
          }

          n=0
          while true; do
            apply_changes
            git add -A

            NEW_TREE="$(git write-tree)"
            # "Nada novo" pelo HASH DA ÁRVORE: pergunta exatamente o que interessa — "a árvore
            # que vou publicar é igual à que já está no remoto?" — sem depender de onde o HEAD
            # aponta. `git diff --staged --quiet` só funciona enquanto o órfão for criado com
            # `commit-tree` (HEAD continua válido); se um dia virar `git checkout --orphan`,
            # o HEAD fica unborn, o diff passa a ser contra a árvore vazia e NUNCA fica vazio.
            if [ "$NEW_TREE" = "$BASE_TREE" ]; then
              echo "Nada novo para publicar (árvore idêntica à do remoto)."
              echo "**Publicação:** nada novo para publicar nesta run." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # COMMIT ÓRFÃO: `commit-tree` SEM -p cria um commit raiz. Apagar pastas num commit
            # normal não devolve espaço — os blobs de vídeo continuam alcançáveis pelo
            # histórico. Com raiz + force push, o histórico antigo fica inalcançável e some
            # do clone. Bônus: sem pai não existe fronteira shallow, então o fetch-depth: 1
            # nunca dá "! [remote rejected] shallow update not allowed".
            COMMIT="$(git commit-tree "$NEW_TREE" -m "Relatório: $RUN_DIR (retenção: últimos $KEEP runs)")"

            # --force-with-lease com SHA EXPLÍCITO: --force puro sempre passaria e atropelaria
            # em silêncio o relatório de uma run concorrente, tornando o retry abaixo código
            # morto. A forma <ref>:<sha> é necessária porque o fetch-depth: 1 não deixa
            # remote-tracking ref confiável para o lease implícito.
            if git push --force-with-lease="refs/heads/reports:$REMOTE_SHA" \
                        origin "$COMMIT:refs/heads/reports"; then
              echo "Relatório publicado com sucesso (commit órfão $COMMIT)."
              {
                echo "**Publicação:** \`$RUN_DIR\` publicado na branch \`reports\` (commit órfão + force push)."
                echo ""
                echo "**Retenção:** mantendo os $KEEP runs mais recentes."
                if [ -s "$PRUNED_LIST" ]; then
                  echo ""
                  echo "Runs podados nesta publicação:"
                  while IFS= read -r RN; do echo "- run #$RN"; done < "$PRUNED_LIST"
                else
                  echo ""
                  echo "Nenhum run podado nesta publicação."
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            n=$((n+1))
            if [ "$n" -ge 5 ]; then
              echo "::error::Falha ao publicar o relatório após 5 tentativas (push rejeitado pelo remoto)."
              echo "**Publicação:** FALHOU após 5 tentativas de push na branch reports." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "Push rejeitado (corrida com outra run) — re-sincronizando com o remoto (tentativa $n/5)"
            git fetch --depth=1 origin reports
            git reset --hard FETCH_HEAD
            # `reset --hard` NÃO remove untracked: sem o clean, sobras da tentativa anterior
            # (ou de um estado remoto que deixou de existir) voltariam no `git add -A`.
            git clean -ffdx
            REMOTE_SHA="$(git rev-parse FETCH_HEAD)"
            BASE_TREE="$(git rev-parse FETCH_HEAD^{tree})"
          done

      - name: Apaga artifacts das runs podadas
        if: always()
        # Explícito: o bloco usa process substitution (< <(awk ...)), que é bash.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          # Este step NUNCA reprova o job: o relatório já foi publicado com sucesso.
          # Toda falha vira ::warning::. Por isso `set +e` + `exit 0` explícito em vez de
          # continue-on-error, que deixaria o step marcado em vermelho no histórico.
          set +e

          PRUNED_LIST="$RUNNER_TEMP/pruned-runs.txt"
          ART="$RUNNER_TEMP/artifacts.tsv"

          if [ ! -s "$PRUNED_LIST" ]; then
            echo "Nenhuma run podada nesta execução — nada a apagar."
            exit 0
          fi

          gh api --paginate -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id, .name, .workflow_run.id] | @tsv' \
            > "$ART"
          if [ $? -ne 0 ] || [ ! -s "$ART" ]; then
            echo "::warning::Não foi possível listar os artifacts do repositório — poda de artifacts ignorada."
            exit 0
          fi

          DELETED=0
          echo "**Artifacts apagados (runs podadas):**" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r N; do
            [ -n "$N" ] || continue
            # Casamento por NOME EXATO — nada de prefixo, senão podar a run 9 apagaria
            # também os artifacts da run 90. Todos os artifacts deste workflow terminam
            # em -<run_number>, o que torna o nome exato suficiente.
            for NAME in "allure-results-android-$N" "allure-results-ios-$N" \
                        "allure-report-android-$N"  "allure-report-ios-$N"; do
              while IFS=$'\t' read -r ID RID; do
                # Cinto e suspensório: jamais tocar nos artifacts da run atual.
                [ "$RID" = "$CURRENT_RUN_ID" ] && continue
                # `< /dev/null` pelo mesmo motivo do -nostdin no ffmpeg: este comando roda
                # dentro de um `while read` e não pode consumir a lista que alimenta o laço.
                if gh api -X DELETE "/repos/$REPO/actions/artifacts/$ID" --silent < /dev/null; then
                  echo "- \`$NAME\` (id $ID)" >> "$GITHUB_STEP_SUMMARY"
                  echo "Artifact removido: $NAME (id $ID)"
                  DELETED=$((DELETED+1))
                else
                  echo "::warning::Falha ao apagar o artifact $NAME (id $ID) — segue o baile."
                fi
              done < <(awk -F'\t' -v n="$NAME" '$2==n {print $1 "\t" $3}' "$ART")
            done
          done < "$PRUNED_LIST"

          if [ "$DELETED" -eq 0 ]; then
            echo "- (nenhum — a retenção de 30 dias do Actions provavelmente já os expirou)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Artifacts apagados: $DELETED"
          exit 0

      - name: Imprime a URL do relatório
        run: |
          REPO="${{ github.repository }}"
          OWNER=$(echo $REPO | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo $REPO | cut -d'/' -f2)
          # RUN_DIR vem do $GITHUB_ENV — não recomputar (a data UTC pode ter virado).
          echo ""
          echo "1) Online (GitHub Pages):"
          echo "   Android: https://${OWNER}.github.io/${REPO_NAME}/${RUN_DIR}/android/"
          echo "   iOS:     https://${OWNER}.github.io/${REPO_NAME}/${RUN_DIR}/ios/"
          echo "   Índice de todos os runs: https://${OWNER}.github.io/${REPO_NAME}/"
          echo ""
          echo "2) Download: aba Actions deste run -> artifacts"
          echo "   'allure-report-android-${{ github.run_number }}' e 'allure-report-ios-${{ github.run_number }}'"
          echo "   Baixe o ZIP, extraia e abra index.html (autocontido, sem servidor)."
