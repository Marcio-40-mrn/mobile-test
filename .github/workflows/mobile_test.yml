name: Mobile E2E — AWS Device Farm

# Roda os testes E2E no AWS Device Farm — TUDO num arquivo só (job device-farm com matrix).
# Android e iOS rodam SEMPRE, em todo pull_request e no dispatch manual — sem input, sem
# gate, sem matrix condicional. Os 5 steps de clientes que falham no iOS por bug de
# acessibilidade do app (bottom sheet sem filhos na árvore XCUITest — ver testspec-ios.yml)
# aparecem vermelhos no relatório; o Device Farm não quebra a esteira (ver "Aguarda…").
#
# Android e iOS compartilham os steps de build, pacote e coleta; divergem só em como
# o run é agendado e como as credenciais chegam ao host (ver os steps "Agenda…"):
#   Android — 1 run para o pool, credenciais por environmentVariables
#   iOS     — 1 run por iPhone, credenciais injetadas no testspec (o host iOS não
#             recebe environmentVariables)
# Desenho herdado do projeto MobileWDIO (.planning/codebase/LICOES-CI-MOBILEWDIO.md).

on:
  pull_request:
  workflow_dispatch:

# Cancela runs antigos da mesma ref quando um novo começa.
concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-farm:
    name: "${{ matrix.platform }} — Device Farm"
    runs-on: ubuntu-latest
    # Uploads + até 120 min de poll no Device Farm + coleta. Rede de segurança
    # contra um step pendurado; o poll já tem o próprio limite.
    timeout-minutes: 150
    strategy:
      # Uma plataforma não cancela a outra ao falhar.
      fail-fast: false
      matrix:
        platform: [android, ios]
    env:
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instala EAS CLI e Allure
        run: npm install -g eas-cli allure-commandline

      # Reproduz no runner o mesmo `npm install` do testspec e carrega o webdriverio como o
      # `wdio run` faz. Um package-lock.json inconsistente (caso do merge 2050647, que deixou
      # o archiver-utils sem dependente e o npm o podou) quebra aqui em ~1 min, em vez de
      # ocupar 5 devices no Device Farm e terminar sem nenhum *-result.json.
      # `npm ci` não serve: o appium-uiautomator2-driver traz um npm-shrinkwrap gerado em
      # Linux e o npm acusa "Missing @img/sharp-*" para as outras plataformas.
      - name: Pré-verifica dependências (mesmo npm install do testspec)
        run: |
          set -euo pipefail
          npm install --prefer-offline
          node --input-type=module -e "await import('webdriverio')"

      - name: Resolve parâmetros da plataforma
        id: vars
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "android" ]; then
            echo "app_file=app.apk"          >> "$GITHUB_OUTPUT"
            echo "app_type=ANDROID_APP"       >> "$GITHUB_OUTPUT"
            echo "testspec=testspec.yml"      >> "$GITHUB_OUTPUT"
          else
            echo "app_file=app.ipa"           >> "$GITHUB_OUTPUT"
            echo "app_type=IOS_APP"           >> "$GITHUB_OUTPUT"
            echo "testspec=testspec-ios.yml"  >> "$GITHUB_OUTPUT"
          fi

      # Qual build baixar vem de SECRETS do repositório (Settings > Secrets and variables >
      # Actions > Secrets — não da aba Variables; `vars.` não enxerga um secret):
      #   BUILD_PROFILE_ANDROID / BUILD_PROFILE_IOS — profile do EAS por plataforma
      #     (Android e iOS costumam ser buildados em profiles diferentes). Vazio =>
      #     mantém o comportamento antigo, filtrando por distribution=internal.
      #   BUILD_SELECTION — latest (default) | date
      #   BUILD_FROM / BUILD_TO — YYYY-MM-DD, inclusivos, só em BUILD_SELECTION=date
      - name: Baixa o build do EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          BUILD_PROFILE_ANDROID: ${{ secrets.BUILD_PROFILE_ANDROID }}
          BUILD_PROFILE_IOS: ${{ secrets.BUILD_PROFILE_IOS }}
          BUILD_SELECTION: ${{ secrets.BUILD_SELECTION }}
          BUILD_FROM: ${{ secrets.BUILD_FROM }}
          BUILD_TO: ${{ secrets.BUILD_TO }}
        run: |
          set -euo pipefail

          # Cada plataforma lê o seu profile; um job nunca usa o do outro. iOS sem
          # variável cai em 'production': no EAS toda build iOS é distribution=store,
          # então o fallback por distribution=internal (que serve ao Android) nunca acha nada.
          if [ "${{ matrix.platform }}" = "android" ]; then
            BUILD_PROFILE="${BUILD_PROFILE_ANDROID:-}"
          else
            BUILD_PROFILE="${BUILD_PROFILE_IOS:-production}"
          fi

          MODE="${BUILD_SELECTION:-latest}"
          if [ "$MODE" != "latest" ] && [ "$MODE" != "date" ]; then
            echo "::error::BUILD_SELECTION inválido: '$MODE'. Use 'latest' ou 'date'."
            exit 1
          fi

          FROM_ISO=""
          TO_ISO=""
          if [ "$MODE" = "date" ]; then
            if [ -z "${BUILD_FROM:-}" ] && [ -z "${BUILD_TO:-}" ]; then
              echo "::error::BUILD_SELECTION='date' exige BUILD_FROM e/ou BUILD_TO."
              exit 1
            fi
            # createdAt do EAS é ISO-8601 UTC, então as bordas viram ISO para
            # permitir comparação lexicográfica direta no jq.
            if [ -n "${BUILD_FROM:-}" ]; then
              FROM_ISO=$(date -u -d "$BUILD_FROM 00:00:00" +%Y-%m-%dT%H:%M:%S.000Z)
            fi
            if [ -n "${BUILD_TO:-}" ]; then
              TO_ISO=$(date -u -d "$BUILD_TO 23:59:59" +%Y-%m-%dT%H:%M:%S.999Z)
            fi
            RANGE_LABEL="${BUILD_FROM:-início} .. ${BUILD_TO:-hoje}"
            LIMIT=100   # mode=date precisa varrer histórico
          else
            RANGE_LABEL="mais recente"
            LIMIT=20
          fi

          # Android sem profile configurado mantém o filtro histórico por distribuição.
          if [ -n "$BUILD_PROFILE" ]; then
            FILTER_ARGS=(--build-profile "$BUILD_PROFILE")
            PROFILE_LABEL="$BUILD_PROFILE"
          else
            FILTER_ARGS=(--distribution internal)
            PROFILE_LABEL="internal"
          fi

          echo "Buscando build ${{ matrix.platform }} '$PROFILE_LABEL' ($RANGE_LABEL)..."
          BUILD_JSON=$(eas build:list --platform "${{ matrix.platform }}" \
            "${FILTER_ARGS[@]}" --limit "$LIMIT" \
            --status finished --json --non-interactive)

          # O mesmo registro que dá a URL traz versão, número do build e profile — vão
          # para o Allure (environment.properties, via APP_* no host) e para o summary.
          SELECTED=$(echo "$BUILD_JSON" | jq -c \
            --arg profile "$BUILD_PROFILE" --arg from "$FROM_ISO" --arg to "$TO_ISO" '
            map(select(.status == "FINISHED" and .artifacts.buildUrl != null))
            | map(select($profile == "" or .buildProfile == $profile))
            | map(select($from    == "" or .createdAt >= $from))
            | map(select($to      == "" or .createdAt <= $to))
            | sort_by(.createdAt) | reverse
            | .[0] // empty')

          if [ -z "$SELECTED" ]; then
            echo "::error::Nenhuma build ${{ matrix.platform }} '$PROFILE_LABEL' finalizada encontrada no EAS ($RANGE_LABEL)."
            exit 1
          fi
          URL=$(echo "$SELECTED" | jq -r '.artifacts.buildUrl')
          APP_VERSION=$(echo "$SELECTED" | jq -r '.appVersion // empty')
          APP_BUILD_VERSION=$(echo "$SELECTED" | jq -r '.appBuildVersion // empty')
          APP_BUILD_PROFILE=$(echo "$SELECTED" | jq -r '.buildProfile // empty')
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "APP_BUILD_VERSION=$APP_BUILD_VERSION"
            echo "APP_BUILD_PROFILE=$APP_BUILD_PROFILE"
          } >> "$GITHUB_ENV"
          echo "Build ${{ matrix.platform }}: versão ${APP_VERSION:-?} (${APP_BUILD_VERSION:-?}), profile ${APP_BUILD_PROFILE:-?}, criado em $(echo "$SELECTED" | jq -r '.createdAt')"
          echo "**Build ${{ matrix.platform }}:** \`${APP_VERSION:-?}\` (${APP_BUILD_VERSION:-?}) — profile \`${APP_BUILD_PROFILE:-?}\`" >> "$GITHUB_STEP_SUMMARY"

          # Profile `production` do Android entrega .aab; o Device Farm só instala .apk
          # (upload ANDROID_APP), então o bundle vira APK universal com o mesmo
          # scripts/convert-aab.ts da execução local (o runner já traz JDK).
          if [ "${{ matrix.platform }}" = "android" ] && [[ "${URL%%\?*}" == *.aab ]]; then
            curl -sSL --retry 3 -o app.aab "$URL"
            npx ts-node scripts/convert-aab.ts --input app.aab --output "${{ steps.vars.outputs.app_file }}"
            rm -f app.aab
          else
            curl -sSL --retry 3 -o "${{ steps.vars.outputs.app_file }}" "$URL"
          fi
          ls -lh "${{ steps.vars.outputs.app_file }}"

      - name: Empacota os testes (sem node_modules — o Device Farm roda npm install)
        run: |
          set -euo pipefail
          zip -r test-package.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x ".claude/*" \
            -x "docs/*" \
            -x "reports/*" \
            -x "test/screenshots/*" \
            -x "test/videos/*" \
            -x "artifacts/*" \
            -x ".env" \
            -x "app.apk" -x "app.aab" -x "app.ipa" \
            -x "test-package.zip"
          # Credenciais nunca viajam no pacote: no Android chegam por environmentVariables,
          # no iOS pelo testspec gerado por run. Um .env aqui seria vazamento.
          if unzip -l test-package.zip | grep -qE ' [.]env$'; then
            echo "::error::Há um .env dentro do test-package.zip — credenciais não viajam no pacote"
            exit 1
          fi
          ls -lh test-package.zip

      - name: Configura credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Sobe app e pacote de testes no Device Farm
        id: uploads
        env:
          PROJECT_ARN: ${{ secrets.DEVICE_FARM_PROJECT_ARN }}
          RUN_NUMBER: ${{ github.run_number }}
          APP_FILE: ${{ steps.vars.outputs.app_file }}
          APP_TYPE: ${{ steps.vars.outputs.app_type }}
        run: |
          set -euo pipefail
          source .github/scripts/devicefarm-upload.sh
          APP_ARN=$(df_upload "app-${RUN_NUMBER}.${APP_FILE##*.}" "$APP_TYPE" "$APP_FILE")
          PKG_ARN=$(df_upload "tests-${RUN_NUMBER}.zip" APPIUM_NODE_TEST_PACKAGE test-package.zip)
          echo "app_arn=$APP_ARN" >> "$GITHUB_OUTPUT"
          echo "pkg_arn=$PKG_ARN" >> "$GITHUB_OUTPUT"

      # Lê o pool da plataforma e decide a conta de cada aparelho — a cada run, sem
      # nenhum modelo de aparelho no repositório. Só um pool PRIVATE com regra
      # "ARN IN" tem uma lista fixa para percorrer (um filtro genérico como "qualquer
      # iPhone com iOS 17" não tem). Ordenação byte a byte (LC_ALL=C) para a
      # distribuição de contas ser a mesma em qualquer locale do runner.
      #
      # Contas: sem o secret CSV da plataforma (TEST_USER_ANDROID_EMAILS /
      # TEST_USER_IOS_EMAILS) todos os aparelhos usam TEST_USER_EMAIL, como sempre.
      # Com o CSV, o i-ésimo device (ordem alfabética do nome) recebe o i-ésimo e-mail;
      # mais devices do que e-mails é erro — dois aparelhos na mesma conta disputariam o
      # mesmo estado no backend. Mudar o pool só redistribui.
      - name: Resolve devices e contas do pool
        id: pool
        env:
          ANDROID_POOL_ARN: ${{ secrets.DEVICE_FARM_DEVICE_POOL_ARN }}
          IOS_POOL_ARN: ${{ secrets.DEVICE_FARM_IOS_DEVICE_POOL_ARN }}
          ANDROID_EMAILS_CSV: ${{ secrets.TEST_USER_ANDROID_EMAILS }}
          IOS_EMAILS_CSV: ${{ secrets.TEST_USER_IOS_EMAILS }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "android" ]; then
            POOL_ARN="$ANDROID_POOL_ARN"; EMAILS_CSV="${ANDROID_EMAILS_CSV:-}"
          else
            POOL_ARN="$IOS_POOL_ARN"; EMAILS_CSV="${IOS_EMAILS_CSV:-}"
          fi

          RULE=$(aws devicefarm get-device-pool --arn "$POOL_ARN" \
            --query "devicePool.rules[?attribute=='ARN' && operator=='IN'].value | [0]" --output text)
          if [ -z "$RULE" ] || [ "$RULE" = "None" ]; then
            echo "::error::O pool ${{ matrix.platform }} não tem regra ARN IN — ajuste-o para uma lista fixa de devices"
            exit 1
          fi

          # nome<TAB>arn<TAB>modelId. O sed tira o espaço final que a API devolve em alguns
          # nomes; modelId é o valor que o UiAutomator2 expõe em capabilities.deviceModel.
          # Alguns devices têm modelId composto ("{SM-A515F,SM-A515U1}"): vira A|B para a
          # vírgula não quebrar o CSV — test/utils/credentials.ts aceita qualquer alternativa.
          : > devices-raw.tsv
          for ARN in $(echo "$RULE" | jq -r '.[]'); do
            aws devicefarm get-device --arn "$ARN" --query 'device.[name,modelId]' --output text \
              | sed 's/[[:space:]]*$//' \
              | awk -v arn="$ARN" -F'\t' '{ m=$2; gsub(/[{}]/, "", m); gsub(/,/, "|", m); print $1 "\t" arn "\t" m }' >> devices-raw.tsv
          done
          LC_ALL=C sort devices-raw.tsv > devices-sorted.tsv
          N=$(wc -l < devices-sorted.tsv)
          [ "$N" -gt 0 ] || { echo "::error::Pool ${{ matrix.platform }} sem devices"; exit 1; }

          # Um secret colado com quebra de linha vira control char ilegal no JSON do run.
          EMAILS=$(printf '%s' "$EMAILS_CSV" | tr -d '[:space:]')
          if [ -n "$EMAILS" ]; then
            MODE=per-device
            mapfile -t EMAIL_LIST < <(printf '%s' "$EMAILS" | tr ',' '\n' | sed '/^$/d')
            if [ "$N" -gt "${#EMAIL_LIST[@]}" ]; then
              echo "::error::$N devices no pool e ${#EMAIL_LIST[@]} e-mail(s) no CSV — dois aparelhos cairiam na mesma conta"
              exit 1
            fi
          else
            MODE=single
            if [ -z "${TEST_USER_EMAIL:-}" ]; then
              echo "::error::Sem TEST_USER_EMAIL nem CSV de e-mails da plataforma"
              exit 1
            fi
          fi

          : > devices.tsv
          i=0
          while IFS=$'\t' read -r NAME ARN MODEL; do
            if [ "$MODE" = per-device ]; then EMAIL="${EMAIL_LIST[$i]}"; else EMAIL="$TEST_USER_EMAIL"; fi
            printf '%s\t%s\t%s\t%s\n' "$NAME" "$ARN" "$MODEL" "$EMAIL" >> devices.tsv
            echo "  $NAME ($MODEL) -> ${EMAIL%%@*}@…"
            i=$((i+1))
          done < devices-sorted.tsv
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Contas: modo $MODE, $N device(s) no pool ${{ matrix.platform }}"

      # Android: um run para o pool inteiro. O host Android herda as environmentVariables
      # do run (todos os devices recebem as mesmas) e o testspec as materializa em .env.
      - name: Agenda o run (Android — um run para o pool inteiro)
        if: matrix.platform == 'android'
        env:
          PROJECT_ARN: ${{ secrets.DEVICE_FARM_PROJECT_ARN }}
          RUN_NUMBER: ${{ github.run_number }}
          APP_ARN: ${{ steps.uploads.outputs.app_arn }}
          PKG_ARN: ${{ steps.uploads.outputs.pkg_arn }}
          POOL_ARN: ${{ secrets.DEVICE_FARM_DEVICE_POOL_ARN }}
          ACCOUNT_MODE: ${{ steps.pool.outputs.mode }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER_PASSWORD_IOS: ${{ secrets.TEST_USER_PASSWORD_IOS }}
          TEST_USER_PIN: ${{ secrets.TEST_USER_PIN }}
          BUILD_PROFILE_ANDROID: ${{ secrets.BUILD_PROFILE_ANDROID }}
        run: |
          set -euo pipefail
          source .github/scripts/devicefarm-upload.sh
          SPEC_ARN=$(df_upload "spec-${RUN_NUMBER}.yml" APPIUM_NODE_TEST_SPEC testspec.yml)

          # Valor vazio vira {"value":""} e o schedule-run responde com um ParamValidation
          # que só aponta o índice do array. Expansão indireta de propósito: eval perde a
          # barra e $$ vira o PID, que nunca é vazio.
          for v in TEST_USER_PASSWORD TEST_USER_PIN; do
            [ -n "${!v}" ] || { echo "::error::Secret $v vazio"; exit 1; }
          done
          ENV_ARGS=(--arg pass "$TEST_USER_PASSWORD" --arg pin "$TEST_USER_PIN")
          ENV_ITEMS='{name:"TEST_USER_PASSWORD",value:$pass},{name:"TEST_USER_PIN",value:$pin}'
          if [ -n "${TEST_USER_EMAIL:-}" ]; then
            ENV_ARGS+=(--arg email "$TEST_USER_EMAIL")
            ENV_ITEMS+=',{name:"TEST_USER_EMAIL",value:$email}'
          fi
          # Senha da trilha de production + o profile do build: o runtime escolhe
          # (test/utils/credentials.ts) — a senha comum só vale no build de development.
          if [ -n "${TEST_USER_PASSWORD_IOS:-}" ]; then
            ENV_ARGS+=(--arg passprod "$TEST_USER_PASSWORD_IOS")
            ENV_ITEMS+=',{name:"TEST_USER_PASSWORD_IOS",value:$passprod}'
          fi
          if [ -n "${BUILD_PROFILE_ANDROID:-}" ]; then
            ENV_ARGS+=(--arg profile "$BUILD_PROFILE_ANDROID")
            ENV_ITEMS+=',{name:"BUILD_PROFILE_ANDROID",value:$profile}'
          fi
          # Versão/build/profile do EAS (step "Baixa o build") → environment.properties do Allure.
          for v in APP_VERSION APP_BUILD_VERSION APP_BUILD_PROFILE; do
            if [ -n "${!v:-}" ]; then
              ENV_ARGS+=(--arg "$v" "${!v}")
              ENV_ITEMS+=",{name:\"$v\",value:\$$v}"
            fi
          done
          if [ "$ACCOUNT_MODE" = per-device ]; then
            # As duas listas na MESMA ordem do devices.tsv: é com elas que o aparelho acha
            # o próprio índice (test/utils/credentials.ts). O Device Farm limita cada
            # variável a 256 caracteres — por isso CSV, e nunca JSON em base64.
            EMAILS=$(cut -f4 devices.tsv | paste -sd, -)
            MODELS=$(cut -f3 devices.tsv | paste -sd, -)
            for v in EMAILS MODELS; do
              VALUE="${!v}"
              if [ "${#VALUE}" -gt 256 ]; then
                echo "::error::$v tem ${#VALUE} caracteres; o Device Farm aceita até 256 por variável"
                exit 1
              fi
            done
            ENV_ARGS+=(--arg emails "$EMAILS" --arg models "$MODELS")
            ENV_ITEMS+=',{name:"TEST_USER_EMAILS",value:$emails},{name:"TEST_USER_DEVICE_MODELS",value:$models}'
          fi
          ENV_JSON=$(jq -nc "${ENV_ARGS[@]}" "{environmentVariables:[$ENV_ITEMS]}")

          TEST_JSON=$(jq -nc \
            --arg tp "$PKG_ARN" --arg ts "$SPEC_ARN" \
            '{type:"APPIUM_NODE",testPackageArn:$tp,testSpecArn:$ts}')

          RUN_ARN=$(aws devicefarm schedule-run \
            --project-arn "$PROJECT_ARN" \
            --app-arn "$APP_ARN" \
            --device-pool-arn "$POOL_ARN" \
            --name "CI android #${RUN_NUMBER}" \
            --test "$TEST_JSON" \
            --configuration "$ENV_JSON" \
            --query 'run.arn' --output text)
          printf 'pool\t%s\n' "$RUN_ARN" > runs.tsv
          echo "Run agendado: $RUN_ARN"

      # iOS: um run por iPhone. Duas limitações medidas do Device Farm (projeto de
      # referência MobileWDIO, "CI iOS Run #6"): as environmentVariables são do run, não
      # do job, e o host iOS NEM as recebe — o script que a AWS gera só exporta
      # DEVICEFARM_*. Logo o aparelho não tem como descobrir a própria conta: o CI decide
      # por ele e injeta e-mail, senha, PIN e o nome do aparelho no testspec daquele run.
      # Um único pacote de testes serve a todos; só o testspec muda.
      - name: Agenda os runs (iOS — um run por iPhone)
        if: matrix.platform == 'ios'
        env:
          PROJECT_ARN: ${{ secrets.DEVICE_FARM_PROJECT_ARN }}
          RUN_NUMBER: ${{ github.run_number }}
          APP_ARN: ${{ steps.uploads.outputs.app_arn }}
          PKG_ARN: ${{ steps.uploads.outputs.pkg_arn }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER_PASSWORD_IOS: ${{ secrets.TEST_USER_PASSWORD_IOS }}
          TEST_USER_PIN: ${{ secrets.TEST_USER_PIN }}
        run: |
          set -euo pipefail
          source .github/scripts/devicefarm-upload.sh
          # A senha da conta é outra no iOS (TEST_USER_PASSWORD só vale no Android de
          # development — medido em 2026-09-16). SEM fallback: no run #30 o secret
          # TEST_USER_PASSWORD_IOS não existia, o host recebeu a senha Android em silêncio e
          # os 5 iPhones falharam no login. Secret ausente tem que parar AQUI, com nome.
          for v in TEST_USER_PASSWORD_IOS TEST_USER_PIN; do
            [ -n "${!v}" ] || { echo "::error::Secret $v vazio ou inexistente — crie-o em Settings > Secrets and variables > Actions > Secrets (senha da conta de teste no iOS)"; exit 1; }
          done
          # O host recebe a senha iOS como TEST_USER_PASSWORD (nome que o .env/credentials.ts leem).
          TEST_USER_PASSWORD="$TEST_USER_PASSWORD_IOS"

          MARKER_LINE=$(grep -n '^      - __CREDENCIAIS_DO_RUN__$' testspec-ios.yml | cut -d: -f1)
          if [ -z "$MARKER_LINE" ]; then
            echo "::error::testspec-ios.yml sem a linha marcadora '      - __CREDENCIAIS_DO_RUN__'"
            exit 1
          fi

          : > runs.tsv
          IDX=0
          exec 3< devices.tsv
          while IFS=$'\t' read -u 3 -r NAME ARN MODEL EMAIL; do
            IDX=$((IDX+1))
            # Fora do workspace: o testspec gerado nunca pode entrar num zip.
            SPEC="$RUNNER_TEMP/testspec-ios-run${RUN_NUMBER}-${IDX}.yml"

            # printf %q devolve cada valor já citado para reuso em shell (apóstrofo, espaço,
            # aspas, $ e barra invertida na senha ou no e-mail). O comando entra no YAML
            # como bloco literal (`- |-`): num escalar simples, um " #" dentro da senha
            # viraria comentário e truncaria a linha. head/tail em vez de sed/awk: eles
            # reinterpretariam os escapes do %q.
            EXPORT_LINE=$(printf '        export TEST_USER_EMAIL=%q TEST_USER_PASSWORD=%q TEST_USER_PIN=%q DEVICE_LABEL=%q APP_VERSION=%q APP_BUILD_VERSION=%q APP_BUILD_PROFILE=%q' \
              "$EMAIL" "$TEST_USER_PASSWORD" "$TEST_USER_PIN" "$NAME" "${APP_VERSION:-}" "${APP_BUILD_VERSION:-}" "${APP_BUILD_PROFILE:-}")
            {
              head -n "$((MARKER_LINE - 1))" testspec-ios.yml
              printf '      - |-\n%s\n' "$EXPORT_LINE"
              tail -n "+$((MARKER_LINE + 1))" testspec-ios.yml
            } > "$SPEC"
            if grep -q '^      - __CREDENCIAIS_DO_RUN__$' "$SPEC" || ! grep -q '^        export TEST_USER_EMAIL=' "$SPEC"; then
              echo "::error::Falha ao injetar as credenciais no testspec de $NAME"
              exit 1
            fi

            SPEC_ARN=$(df_upload "spec-${RUN_NUMBER}-${IDX}.yml" APPIUM_NODE_TEST_SPEC "$SPEC")
            # Mira UM aparelho pelo ARN, sem criar um device pool de 1 device para cada.
            # Plano B, se a conta AWS recusar o parâmetro: create-device-pool com uma regra
            # "ARN IN" por aparelho e --device-pool-arn.
            SELECTION=$(jq -nc --arg arn "$ARN" \
              '{filters:[{attribute:"ARN",operator:"IN",values:[$arn]}],maxDevices:1}')
            TEST_JSON=$(jq -nc \
              --arg tp "$PKG_ARN" --arg ts "$SPEC_ARN" \
              '{type:"APPIUM_NODE",testPackageArn:$tp,testSpecArn:$ts}')
            # Sem --configuration: o host iOS não receberia as variáveis mesmo.
            RUN_ARN=$(aws devicefarm schedule-run \
              --project-arn "$PROJECT_ARN" \
              --app-arn "$APP_ARN" \
              --device-selection-configuration "$SELECTION" \
              --name "CI ios #${RUN_NUMBER} - ${NAME}" \
              --test "$TEST_JSON" \
              --query 'run.arn' --output text)
            printf '%s\t%s\n' "$NAME" "$RUN_ARN" >> runs.tsv
            echo "Run agendado para $NAME: $RUN_ARN"
          done
          exec 3<&-
          echo "$IDX run(s) iOS agendado(s)"

      # runs.tsv tem 1 linha no Android (o pool) e N no iOS (um por iPhone). Os runs iOS
      # correm em paralelo no Device Farm: o tempo de parede é o do aparelho mais lento.
      - name: Aguarda os runs terminarem
        run: |
          set -euo pipefail
          [ -s runs.tsv ] || { echo "::error::Nenhum run agendado (runs.tsv vazio)"; exit 1; }
          ALL_DONE=false
          for i in $(seq 1 120); do
            PENDING=0
            LINES=""
            exec 3< runs.tsv
            while IFS=$'\t' read -u 3 -r LABEL RUN_ARN; do
              READ=$(aws devicefarm get-run --arn "$RUN_ARN" --query 'run.[status,result]' --output text)
              STATUS=$(echo "$READ" | awk '{print $1}')
              RESULT_VAL=$(echo "$READ" | awk '{print $2}')
              case "$STATUS" in
                PENDING|PENDING_CONCURRENCY|PENDING_DEVICE|PREPARING|RUNNING|SCHEDULING) PENDING=$((PENDING+1)) ;;
              esac
              LINES+="  $LABEL: $STATUS / $RESULT_VAL"$'\n'
            done
            exec 3<&-
            echo "Poll $i/120:"; printf '%s' "$LINES"
            if [ "$PENDING" -eq 0 ]; then ALL_DONE=true; break; fi
            sleep 60
          done
          if [ "$ALL_DONE" != "true" ]; then
            echo "::error::Timeout aguardando o Device Farm (${{ matrix.platform }})."
            exit 1
          fi

          # O resultado do teste reflete no relatório; só timeout quebra a esteira.
          echo "**Device Farm (${{ matrix.platform }}):** o resultado reflete no relatório, não quebra a esteira." >> "$GITHUB_STEP_SUMMARY"
          exec 3< runs.tsv
          while IFS=$'\t' read -u 3 -r LABEL RUN_ARN; do
            RESULT_VAL=$(aws devicefarm get-run --arn "$RUN_ARN" --query 'run.result' --output text)
            echo "::notice::Device Farm ${{ matrix.platform }} ($LABEL): $RESULT_VAL — ver relatório Allure"
            echo "- \`$RESULT_VAL\` — $LABEL" >> "$GITHUB_STEP_SUMMARY"
          done
          exec 3<&-

      - name: Coleta artefatos (Allure) do Device Farm
        if: always()
        run: |
          set -uo pipefail
          mkdir -p artifacts allure-results
          [ -s runs.tsv ] || { echo "Sem runs.tsv — pulando coleta"; exit 0; }
          i=0
          SPEC_OUTPUT_URL=""
          # Laço externo sobre os runs (1 no Android, N no iOS); dentro, os jobs de cada um.
          exec 3< runs.tsv
          while IFS=$'\t' read -u 3 -r LABEL RUN_ARN; do
            for JOB_ARN in $(aws devicefarm list-jobs --arn "$RUN_ARN" --query 'jobs[].arn' --output text); do
              SUITE_ARN=$(aws devicefarm list-suites --arn "$JOB_ARN" \
                --query "suites[?name=='Tests Suite'].arn | [0]" --output text)
              [ -z "$SUITE_ARN" ] || [ "$SUITE_ARN" = "None" ] && { i=$((i+1)); continue; }
              TEST_ARN=$(aws devicefarm list-tests --arn "$SUITE_ARN" --query 'tests[0].arn' --output text)
              URL=$(aws devicefarm list-artifacts --arn "$TEST_ARN" --type FILE \
                --query "artifacts[?name=='Customer Artifacts'].url | [0]" --output text)
              if [ -n "$URL" ] && [ "$URL" != "None" ]; then
                curl -sL --retry 3 --max-time 180 "$URL" -o "artifacts/ca-$i.zip" || true
                unzip -o "artifacts/ca-$i.zip" -d "artifacts/ca-$i" >/dev/null 2>&1 || true
                # Os allure-results ficam em algum nível dentro do $DEVICEFARM_LOG_DIR extraído.
                # -n (no-clobber): resultados e anexos têm nome UUID, únicos entre devices.
                find "artifacts/ca-$i" -type d -name allure-results -exec cp -rn {}/. allure-results/ \; 2>/dev/null || true
              fi
              # iOS: o host macos_tahoe não tem ffmpeg, então o XCUITest não grava (wdio.conf.ts
              # pula a gravação). O Device Farm grava a sessão inteira por job (artefato VIDEO,
              # h264, ~3 MB por iPhone medido no run #30) — anexa esse .mp4 a cada resultado
              # deste aparelho. O step "Re-encoda vídeos" normaliza o tamanho como no Android.
              if [ "${{ matrix.platform }}" = "ios" ]; then
                VIDEO_URL=$(aws devicefarm list-artifacts --arn "$TEST_ARN" --type FILE \
                  --query "artifacts[?type=='VIDEO'].url | [0]" --output text)
                VIDEO_FILE="devicefarm-video-$i.mp4"
                if [ -n "$VIDEO_URL" ] && [ "$VIDEO_URL" != "None" ] \
                   && curl -sL --retry 3 --max-time 300 "$VIDEO_URL" -o "allure-results/$VIDEO_FILE"; then
                  N_ATTACHED=0
                  while IFS= read -r -u 4 RESULT; do
                    NAME=$(basename "$RESULT")
                    [ -f "allure-results/$NAME" ] || continue
                    jq --arg src "$VIDEO_FILE" \
                      '.attachments = ((.attachments // []) + [{"name":"Vídeo da execução (Device Farm — sessão do aparelho)","source":$src,"type":"video/mp4"}])' \
                      "allure-results/$NAME" > "allure-results/$NAME.tmp" && mv "allure-results/$NAME.tmp" "allure-results/$NAME"
                    N_ATTACHED=$((N_ATTACHED+1))
                  done 4< <(find "artifacts/ca-$i" -path '*allure-results/*-result.json' -type f)
                  echo "$LABEL: vídeo do Device Farm anexado a $N_ATTACHED resultado(s)"
                else
                  echo "::warning::$LABEL: sem artefato VIDEO no Device Farm — resultados ficam sem vídeo"
                  rm -f "allure-results/$VIDEO_FILE"
                fi
              fi
              # Guarda o log do testspec do primeiro device para diagnóstico (ver abaixo).
              if [ -z "$SPEC_OUTPUT_URL" ]; then
                SPEC_OUTPUT_URL=$(aws devicefarm list-artifacts --arn "$TEST_ARN" --type FILE \
                  --query "artifacts[?name=='Test spec output'].url | [0]" --output text)
              fi
              i=$((i+1))
            done
          done
          exec 3<&-
          COLLECTED=$(find allure-results -maxdepth 1 -type f -name '*-result.json' | wc -l)
          echo "allure-results coletados: $(ls -1 allure-results | wc -l) arquivos ($COLLECTED *-result.json) de $i job(s)"

          # Nenhum resultado = o WDIO morreu antes do primeiro teste (ex.: módulo ausente por
          # lockfile inconsistente, credencial que não chegou ao host). O motivo está no
          # "Test spec output" do Device Farm, que até aqui só era visível no console da
          # AWS — imprime o fim dele no log do job.
          if [ "$COLLECTED" -eq 0 ] && [ -n "$SPEC_OUTPUT_URL" ] && [ "$SPEC_OUTPUT_URL" != "None" ]; then
            echo "::group::Test spec output (últimas 40 linhas — nenhum *-result.json coletado)"
            curl -sL --retry 3 --max-time 60 "$SPEC_OUTPUT_URL" | tail -n 40 || true
            echo "::endgroup::"
          fi

      - name: Publica allure-results como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # O número da run no nome é o que permite apagar este artifact junto com a
          # pasta run-N podada da branch reports (step "Apaga artifacts das runs podadas").
          name: allure-results-${{ matrix.platform }}-${{ github.run_number }}
          path: allure-results
          if-no-files-found: warn
          retention-days: 30

  publish-report:
    name: Publica relatório Allure no GitHub Pages
    needs: device-farm
    if: always()
    runs-on: ubuntu-latest
    # Teto duro do job: vale para qualquer step. Sem isto, um ffmpeg travado no handler
    # interativo segurou o runner por 4h05.
    timeout-minutes: 30
    permissions:
      contents: write   # push na branch reports
      actions: write    # DELETE em /actions/artifacts/<id>
    env:
      # ÚNICA variável de retenção: quantas pastas run-*/ ficam na branch reports.
      KEEP: "3"
    # Serializa publicações de runs sobrepostas para evitar corrida de push na branch reports.
    concurrency:
      group: reports-publish
      cancel-in-progress: false

    steps:
      - name: Define RUN_DIR (fonte única da verdade)
        # Calculado UMA vez. Antes era recomputado no publish e no print da URL: se o job
        # cruzasse a meia-noite UTC entre os dois, a URL apontava para uma pasta inexistente.
        run: echo "RUN_DIR=run-${{ github.run_number }}-$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Checkout main (para ter os scripts)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instala Allure CLI
        run: npm install -g allure-commandline

      - name: Baixa allure-results Android
        uses: actions/download-artifact@v4
        with:
          name: allure-results-android-${{ github.run_number }}
          path: allure-results-android/
        continue-on-error: true

      - name: Baixa allure-results iOS
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ios-${{ github.run_number }}
          path: allure-results-ios/
        continue-on-error: true

      - name: Valida allure-results (exige ao menos um *-result.json)
        run: |
          # Diretório não-vazio NÃO serve como critério: environment.properties, categories.json,
          # executor.json e history/ são arquivos fixos do Allure e produzem um relatório de
          # 0 testes visualmente idêntico a um sucesso. O único sinal de execução real é
          # a presença de *-result.json.
          for PLAT in android ios; do
            SRC="allure-results-$PLAT"
            # Diretório ausente = o job da plataforma não chegou a publicar o artifact (falhou
            # antes da coleta). Não merece anotação — só o caso abaixo merece.
            if [ ! -d "$SRC" ]; then
              echo "$PLAT: não executado nesta run"
              continue
            fi
            if [ -n "$(find "$SRC" -maxdepth 1 -type f -name '*-result.json' -print -quit)" ]; then
              echo "$PLAT: $(find "$SRC" -maxdepth 1 -type f -name '*-result.json' | wc -l) resultado(s) de teste"
            else
              # A plataforma rodou mas não trouxe nenhum resultado — isso É um problema.
              echo "::warning::$SRC existe mas não tem nenhum *-result.json — plataforma $PLAT ignorada nesta run."
              # Remove o diretório: a partir daqui `[ -d "$SRC" ]` volta a ser critério
              # correto em TODOS os steps seguintes (histórico, ffmpeg, generate).
              rm -rf "$SRC"
            fi
          done

      - name: Checkout da branch reports
        uses: actions/checkout@v4
        with:
          ref: reports
          path: reports-branch
          # fetch-depth: 1 — só a árvore do commit mais recente (já contém todos os run-N/).
          # Evita baixar todo o histórico pesado da branch (relatórios + vídeos), que corrompia
          # o checkout e causava "fatal: could not parse HEAD" no commit.
          fetch-depth: 1

      - name: Copia o histórico Allure por plataforma (aba Trend)
        run: |
          # Cada plataforma acumula só o seu histórico: lê do último run que tenha
          # a subpasta da plataforma. Roda ANTES de gerar o relatório atual.
          LATEST=$(ls reports-branch/ | grep "^run-" | sort -V | tail -1)
          for PLAT in android ios; do
            # GUARDA: só semeia histórico de plataforma que realmente rodou. Sem isto o
            # `mkdir -p` abaixo RECRIA o diretório que o step de validação apagou, e o Allure
            # gera um relatório de 0 testes com aba Trend — pior que nenhum relatório.
            if [ ! -d "allure-results-$PLAT" ]; then
              echo "Sem resultados $PLAT — histórico não semeado"
              continue
            fi
            SRC="reports-branch/$LATEST/$PLAT/history"
            if [ -n "$LATEST" ] && [ -d "$SRC" ]; then
              mkdir -p "allure-results-$PLAT/history"
              cp -r "$SRC/." "allure-results-$PLAT/history/"
              echo "Histórico $PLAT copiado de: $LATEST"
            else
              echo "Nenhum histórico $PLAT anterior encontrado"
            fi
          done

      - name: Re-encoda vídeos para H.264 (player do navegador)
        if: always()
        continue-on-error: true
        # Teto do step: mesmo com -nostdin e timeout por arquivo, um lote grande não pode
        # comer o orçamento inteiro do job.
        timeout-minutes: 20
        # Explícito porque o bloco abaixo usa process substitution (3< <(...)), que é bash,
        # não POSIX sh — imune a uma futura mudança de defaults.run.shell neste arquivo.
        shell: bash
        run: |
          # Normaliza TODOS os .mp4 para H.264 + faststart com bitrate limitado e downscale,
          # mantendo o mesmo nome (a referência no *-result.json continua válida). Motivos:
          #  - Android (MediaProjection): já é h264, MAS em resolução alta passava de 100MB
          #    (limite por arquivo do GitHub) e era apagado no publish -> vídeo 404 no
          #    relatório. Re-encodar com -maxrate 2M + downscale garante <95MB.
          #  - iOS (Appium 1.x, quando habilitado): grava em MJPEG, que o navegador não toca
          #    em <video> — precisa virar h264.
          which ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y ffmpeg; }
          for PLAT in android ios; do
            SRC="allure-results-$PLAT"
            [ -d "$SRC" ] || continue
            # ARMADILHA (custou uma run de 4h05): sem -nostdin o ffmpeg herda a stdin do
            # `while read` e ENGOLE a lista de arquivos do find; ao receber lixo binário cai no
            # handler interativo ("Enter command: <target>|all <time>|-1 <command>[ <argument>]")
            # e fica bloqueado para sempre. Três correções combinadas:
            #   1) -nostdin             -> o ffmpeg não abre stdin;
            #   2) lista no FD 3        -> mesmo que abrisse, não é a stdin do laço;
            #   3) timeout 300 por arq. -> teto duro por arquivo, para qualquer travamento novo.
            while IFS= read -r -u 3 f; do
              # `|| true`: o run: roda com `bash -e`, e o ffprobe falha em .mp4 truncado —
              # sem isso a atribuição derrubaria o step inteiro.
              codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$f" 2>/dev/null || true)
              if timeout 300 ffmpeg -nostdin -y -loglevel error -i "$f" \
                   -vf "scale=-2:'min(1280,ih)'" \
                   -c:v libx264 -crf 28 -preset veryfast -maxrate 2M -bufsize 4M \
                   -pix_fmt yuv420p -an -movflags +faststart "${f}.tmp.mp4"; then
                mv "${f}.tmp.mp4" "$f"
                echo "Re-encodado $f ($codec -> h264, <=720p/2Mbps)"
              else
                rm -f "${f}.tmp.mp4"
                echo "::warning::Falha/timeout ao re-encodar $f (codec $codec) — mantido original"
              fi
            done 3< <(find "$SRC" -type f -name '*.mp4')
          done

      - name: Gera os relatórios Allure HTML por plataforma
        run: |
          for PLAT in android ios; do
            SRC="allure-results-$PLAT"
            # O step "Valida allure-results" já removeu diretórios sem *-result.json,
            # então a existência do diretório é critério suficiente e correto aqui.
            if [ -d "$SRC" ]; then
              allure generate "./$SRC" --clean -o "./allure-report-$PLAT"
              echo "Relatório $PLAT gerado"
            else
              echo "Sem resultados $PLAT — pulando geração"
            fi
          done

      - name: Gera relatórios single-file (baixável)
        if: always()
        run: |
          for PLAT in android ios; do
            SRC="allure-results-$PLAT"
            if [ -d "$SRC" ]; then
              allure generate "./$SRC" --clean --single-file -o "./allure-single-$PLAT"
              echo "Single-file $PLAT em ./allure-single-$PLAT/index.html"
            else
              echo "Sem resultados $PLAT — pulando single-file"
            fi
          done

      - name: Publica relatório Android (single-file) como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-android-${{ github.run_number }}
          path: allure-single-android/
          if-no-files-found: warn
          retention-days: 30

      - name: Publica relatório iOS (single-file) como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-ios-${{ github.run_number }}
          path: allure-single-ios/
          if-no-files-found: warn
          retention-days: 30

      - name: Publica os relatórios na branch reports
        if: always()
        timeout-minutes: 15
        run: |
          set -u

          # Números das runs podadas, consumidos pelo step seguinte. Ficam em $RUNNER_TEMP,
          # FORA de reports-branch/: qualquer arquivo dentro do checkout entraria no
          # `git add -A` e seria commitado junto com o relatório.
          PRUNED_LIST="$RUNNER_TEMP/pruned-runs.txt"
          : > "$PRUNED_LIST"

          # --- Guarda: nada gerado -> falha do job, não "nada a publicar" ---
          # Era ::warning:: + exit 0, e o job ficava verde: os runs #16, #17 e #18 rodaram
          # no Device Farm sem executar um teste sequer (WDIO morreu no import) e ninguém
          # notou por três semanas. Um run que rodou e não trouxe resultado é falha de infra.
          if [ ! -d "allure-report-android" ] && [ ! -d "allure-report-ios" ]; then
            MSG="Nenhuma plataforma produziu *-result.json — relatório não publicado nesta run. Veja o log 'Test spec output' no step 'Coleta artefatos' do job device-farm."
            echo "::error::$MSG"
            echo "**Publicação:** FALHOU — $MSG" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          cd reports-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Estado do remoto conhecido neste momento (o checkout veio dele).
          REMOTE_SHA="$(git rev-parse HEAD)"
          BASE_TREE="$(git rev-parse HEAD^{tree})"

          # (Re)aplica a contribuição desta run sobre a árvore ATUAL da branch reports.
          # É idempotente: pode rodar de novo após re-sincronizar com o remoto.
          apply_changes() {
            for PLAT in android ios; do
              if [ -d "../allure-report-$PLAT" ]; then
                rm -rf "$RUN_DIR/$PLAT"
                mkdir -p "$RUN_DIR/$PLAT"
                cp -r "../allure-report-$PLAT/." "$RUN_DIR/$PLAT/"
                echo "Copiado $PLAT para: $RUN_DIR/$PLAT"
              else
                echo "Sem relatório $PLAT para copiar"
              fi
            done

            # A mesma run republicada em outra data (re-run) não pode virar duas pastas.
            for d in run-${{ github.run_number }}-*; do
              [ -d "$d" ] || continue
              [ "$d" = "$RUN_DIR" ] || { rm -rf "./$d"; echo "Removida duplicata da mesma run: $d"; }
            done

            # --- RETENÇÃO: mantém apenas os $KEEP runs mais recentes ---
            # `sort -V` é OBRIGATÓRIO: em ordem lexicográfica run-100 viria ANTES de run-9,
            # e a poda apagaria justamente os runs mais novos.
            : > "$PRUNED_LIST"
            find . -maxdepth 1 -type d -name 'run-*' -printf '%P\n' \
              | sort -V | head -n "-$KEEP" | while IFS= read -r d; do
                  [ -n "$d" ] || continue
                  rm -rf "./$d"
                  printf '%s\n' "$d" | sed -E 's/^run-([0-9]+)-.*/\1/' >> "$PRUNED_LIST"
                  echo "Podado (retenção KEEP=$KEEP): $d"
                done

            # Roda DEPOIS da poda: o script varre o disco, então os runs removidos
            # somem da tabela sem depender do JavaScript do cliente.
            node ../scripts/generate-report-index.mjs .

            # Remove anexos > 95MB (limite de 100MB por arquivo do GitHub).
            # Exclui .git/ — caso contrário o packfile (>95MB com vídeos acumulados)
            # é apagado e o git seguinte falha com "fatal: could not parse HEAD".
            # O commit órfão NÃO dispensa isto: o limite é por blob da árvore nova.
            find . -path './.git' -prune -o -type f -size +95M -print0 | xargs -0 -r rm -f
          }

          n=0
          while true; do
            apply_changes
            git add -A

            NEW_TREE="$(git write-tree)"
            # "Nada novo" pelo HASH DA ÁRVORE: pergunta exatamente o que interessa — "a árvore
            # que vou publicar é igual à que já está no remoto?" — sem depender de onde o HEAD
            # aponta. `git diff --staged --quiet` só funciona enquanto o órfão for criado com
            # `commit-tree` (HEAD continua válido); se um dia virar `git checkout --orphan`,
            # o HEAD fica unborn, o diff passa a ser contra a árvore vazia e NUNCA fica vazio.
            if [ "$NEW_TREE" = "$BASE_TREE" ]; then
              echo "Nada novo para publicar (árvore idêntica à do remoto)."
              echo "**Publicação:** nada novo para publicar nesta run." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # COMMIT ÓRFÃO: `commit-tree` SEM -p cria um commit raiz. Apagar pastas num commit
            # normal não devolve espaço — os blobs de vídeo continuam alcançáveis pelo
            # histórico. Com raiz + force push, o histórico antigo fica inalcançável e some
            # do clone. Bônus: sem pai não existe fronteira shallow, então o fetch-depth: 1
            # nunca dá "! [remote rejected] shallow update not allowed".
            COMMIT="$(git commit-tree "$NEW_TREE" -m "Relatório: $RUN_DIR (retenção: últimos $KEEP runs)")"

            # --force-with-lease com SHA EXPLÍCITO: --force puro sempre passaria e atropelaria
            # em silêncio o relatório de uma run concorrente, tornando o retry abaixo código
            # morto. A forma <ref>:<sha> é necessária porque o fetch-depth: 1 não deixa
            # remote-tracking ref confiável para o lease implícito.
            if git push --force-with-lease="refs/heads/reports:$REMOTE_SHA" \
                        origin "$COMMIT:refs/heads/reports"; then
              echo "Relatório publicado com sucesso (commit órfão $COMMIT)."
              {
                echo "**Publicação:** \`$RUN_DIR\` publicado na branch \`reports\` (commit órfão + force push)."
                echo ""
                echo "**Retenção:** mantendo os $KEEP runs mais recentes."
                if [ -s "$PRUNED_LIST" ]; then
                  echo ""
                  echo "Runs podados nesta publicação:"
                  while IFS= read -r RN; do echo "- run #$RN"; done < "$PRUNED_LIST"
                else
                  echo ""
                  echo "Nenhum run podado nesta publicação."
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            n=$((n+1))
            if [ "$n" -ge 5 ]; then
              echo "::error::Falha ao publicar o relatório após 5 tentativas (push rejeitado pelo remoto)."
              echo "**Publicação:** FALHOU após 5 tentativas de push na branch reports." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "Push rejeitado (corrida com outra run) — re-sincronizando com o remoto (tentativa $n/5)"
            git fetch --depth=1 origin reports
            git reset --hard FETCH_HEAD
            # `reset --hard` NÃO remove untracked: sem o clean, sobras da tentativa anterior
            # (ou de um estado remoto que deixou de existir) voltariam no `git add -A`.
            git clean -ffdx
            REMOTE_SHA="$(git rev-parse FETCH_HEAD)"
            BASE_TREE="$(git rev-parse FETCH_HEAD^{tree})"
          done

      - name: Apaga artifacts das runs podadas
        if: always()
        # Explícito: o bloco usa process substitution (< <(awk ...)), que é bash.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          # Este step NUNCA reprova o job: o relatório já foi publicado com sucesso.
          # Toda falha vira ::warning::. Por isso `set +e` + `exit 0` explícito em vez de
          # continue-on-error, que deixaria o step marcado em vermelho no histórico.
          set +e

          PRUNED_LIST="$RUNNER_TEMP/pruned-runs.txt"
          ART="$RUNNER_TEMP/artifacts.tsv"

          if [ ! -s "$PRUNED_LIST" ]; then
            echo "Nenhuma run podada nesta execução — nada a apagar."
            exit 0
          fi

          gh api --paginate -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id, .name, .workflow_run.id] | @tsv' \
            > "$ART"
          if [ $? -ne 0 ] || [ ! -s "$ART" ]; then
            echo "::warning::Não foi possível listar os artifacts do repositório — poda de artifacts ignorada."
            exit 0
          fi

          DELETED=0
          echo "**Artifacts apagados (runs podadas):**" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r N; do
            [ -n "$N" ] || continue
            # Casamento por NOME EXATO — nada de prefixo, senão podar a run 9 apagaria
            # também os artifacts da run 90. Todos os artifacts deste workflow terminam
            # em -<run_number>, o que torna o nome exato suficiente.
            for NAME in "allure-results-android-$N" "allure-results-ios-$N" \
                        "allure-report-android-$N"  "allure-report-ios-$N"; do
              while IFS=$'\t' read -r ID RID; do
                # Cinto e suspensório: jamais tocar nos artifacts da run atual.
                [ "$RID" = "$CURRENT_RUN_ID" ] && continue
                # `< /dev/null` pelo mesmo motivo do -nostdin no ffmpeg: este comando roda
                # dentro de um `while read` e não pode consumir a lista que alimenta o laço.
                if gh api -X DELETE "/repos/$REPO/actions/artifacts/$ID" --silent < /dev/null; then
                  echo "- \`$NAME\` (id $ID)" >> "$GITHUB_STEP_SUMMARY"
                  echo "Artifact removido: $NAME (id $ID)"
                  DELETED=$((DELETED+1))
                else
                  echo "::warning::Falha ao apagar o artifact $NAME (id $ID) — segue o baile."
                fi
              done < <(awk -F'\t' -v n="$NAME" '$2==n {print $1 "\t" $3}' "$ART")
            done
          done < "$PRUNED_LIST"

          if [ "$DELETED" -eq 0 ]; then
            echo "- (nenhum — a retenção de 30 dias do Actions provavelmente já os expirou)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Artifacts apagados: $DELETED"
          exit 0

      - name: Imprime a URL do relatório
        run: |
          REPO="${{ github.repository }}"
          OWNER=$(echo $REPO | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo $REPO | cut -d'/' -f2)
          # RUN_DIR vem do $GITHUB_ENV — não recomputar (a data UTC pode ter virado).
          echo ""
          echo "1) Online (GitHub Pages):"
          echo "   Android: https://${OWNER}.github.io/${REPO_NAME}/${RUN_DIR}/android/"
          echo "   iOS:     https://${OWNER}.github.io/${REPO_NAME}/${RUN_DIR}/ios/"
          echo "   Índice de todos os runs: https://${OWNER}.github.io/${REPO_NAME}/"
          echo ""
          echo "2) Download: aba Actions deste run -> artifacts"
          echo "   'allure-report-android-${{ github.run_number }}' e 'allure-report-ios-${{ github.run_number }}'"
          echo "   Baixe o ZIP, extraia e abra index.html (autocontido, sem servidor)."
